# blogdumoderateur.com -- niveau 3 -- pagination /page/{n}/ + categories
# Les selecteurs de l'exemple du sujet (h2.post-title a) ne matchent plus rien,
# le site a ete redesigne depuis. Selecteurs revalides sur /articles/ :
# le lien <a> enveloppe le <h3 class="entry-title">, il n'est pas dedans.
url: https://www.blogdumoderateur.com/articles/
pagination:
  pattern: /page/{n}/
  start: 1
  max_pages: 5
selectors:
  titre: article h3.entry-title
  url: article .entry-header a
  date: article time[datetime]
  categorie: article span.favtag
  chapeau: article .entry-excerpt
fetcher:
  delay: 1.5
  retries: 3
  timeout: 15
  user_agent: DataHarvest/1.0 (+contact@ipssi.fr)
store:
  backend: sqlite
  path: output/blogdumoderateur.db
